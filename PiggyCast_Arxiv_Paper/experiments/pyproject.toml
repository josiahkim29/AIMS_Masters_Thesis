[project]
name = "piggycast-experiments"
version = "0.1.0"
description = "Experiments and figures for the PiggyCast paper (stacking WeatherBench 2 forecasts)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "xarray>=2024.10,<2026",
    "zarr>=3.0",
    "gcsfs>=2024.10",
    "netcdf4>=1.7",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "xgboost>=3.0",
    "shap>=0.46",
    "matplotlib>=3.9",
    "cartopy>=0.24",
]

[tool.uv]
package = false
